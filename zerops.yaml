project:
  name: zerotrace

services:
  - hostname: collector
    type: nodejs@20
    build:
      base: nodejs@20
      buildCommands:
        - cd apps/collector && npm ci && npm run build || true
      deployFiles:
        - apps/collector
        - package.json
    run:
      base: nodejs@20
      ports:
        - port: 8080
          http:
            public: true
      start: cd apps/collector && npx ts-node index.ts

  - hostname: ai-engine
    type: nodejs@20
    build:
      base: nodejs@20
      buildCommands:
        - cd apps/ai-engine && npm ci && npm run build || true
      deployFiles:
        - apps/ai-engine
        - package.json
    run:
      base: nodejs@20
      ports:
        - port: 5000
          http:
            public: true
      start: cd apps/ai-engine && npx ts-node index.ts

  - hostname: target
    type: nodejs@20
    envSecrets:
      COLLECTOR_URL: "http://collector:8080/v1/traces"
    build:
      base: nodejs@20
      buildCommands:
        - cd apps/target && npm ci && npm run build || true
      deployFiles:
        - apps/target
        - package.json
    run:
      base: nodejs@20
      ports:
        - port: 4000
          http:
            public: true
      start: cd apps/sample && npx ts-node index.ts

  - hostname: fe
    type: nodejs@20
    build:
      base: nodejs@20
      buildCommands:
        - cd apps/fe && npm ci && npm run build
      deployFiles:
        - apps/fe/.next
        - apps/fe/public
        - apps/fe/package.json
        - apps/fe/node_modules
    run:
      base: nodejs@20
      ports:
        - port: 3000
          http:
            public: true
      start: cd apps/fe && npm start