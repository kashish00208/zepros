zerops:
  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd apps/fe && npm ci && npm run build
      deployFiles:
        - apps/fe/.next
        - apps/fe/public
        - apps/fe/package.json
        - apps/fe/node_modules
    run:
      base: nodejs@20
      ports:
        - port: 3000
          http:
            public: true
      start: cd apps/fe && npm start

  - setup: collector
    build:
      base: nodejs@20
      buildCommands:
        - cd apps/collector && npm ci && npm run build || true
      deployFiles:
        - apps/collector
        - package.json
    run:
      base: nodejs@20
      ports:
        - port: 8080
          http:
            public: true
      start: cd apps/collector && npx ts-node index.ts

  - setup: aiengine
    build:
      base: nodejs@20
      buildCommands:
        - cd apps/ai-engine && npm ci && npm run build || true
      deployFiles:
        - apps/ai-engine
        - package.json
    run:
      base: nodejs@20
      ports:
        - port: 5000
          http:
            public: true
      start: cd apps/ai-engine && npx ts-node index.ts

  - setup: sampleapp
    build:
      base: nodejs@20
      buildCommands:
        - cd apps/sample && npm ci && npm run build || true
      deployFiles:
        - apps/sample
        - package.json
    run:
      base: nodejs@20
      ports:
        - port: 4000
          http:
            public: true
      start: cd apps/sample && npx ts-node index.ts